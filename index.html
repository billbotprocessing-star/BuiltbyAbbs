<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="themeColor" content="#F2F4F1">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Abbs">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script>
        // Apply the saved theme before first paint so the page never flashes the wrong colors
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'light' || t === 'dark') {
                    document.documentElement.setAttribute('data-theme', t);
                    document.documentElement.style.colorScheme = t;
                }
            } catch (e) {}
        })();
    </script>
    <title>BuiltbyAbbs - Macro Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* ---------- Design tokens ----------
           Color carries data: buttons are neutral (ink); protein, carbs and fats each keep one hue everywhere. */
        :root {
            --chalk: #F2F4F1;
            --surface: #FFFFFF;
            --ink: #18251F;
            --ink-2: #55635B;
            --line: #DCE2DD;
            --protein: #2E5BD8;
            --carbs: #E9A23B;
            --fats: #C8557A;
            --ok: #2E8B57;
            --over: #D2492F;
            --on-over: #FFFFFF;
            --display: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
            --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        :root[data-theme="dark"] {
            --chalk: #0F1713;
            --surface: #17211C;
            --ink: #EBF1ED;
            --ink-2: #9DADA3;
            --line: #26342D;
            --protein: #6C93FF;
            --carbs: #F0B24E;
            --fats: #E27A9C;
            --ok: #4CC28A;
            --over: #FF7458;
            --on-over: #1A0F0B;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --chalk: #0F1713;
                --surface: #17211C;
                --ink: #EBF1ED;
                --ink-2: #9DADA3;
                --line: #26342D;
                --protein: #6C93FF;
                --carbs: #F0B24E;
                --fats: #E27A9C;
                --ok: #4CC28A;
                --over: #FF7458;
                --on-over: #1A0F0B;
            }
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; }
        body {
            background: var(--chalk);
            color: var(--ink);
            font: 400 16px/1.45 var(--body);
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }
        h1, h2, h3, p { margin: 0; }
        .hidden { display: none !important; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        :focus-visible { outline: 2px solid var(--protein); outline-offset: 2px; }
        .num { font-family: var(--display); font-variant-numeric: tabular-nums; }

        /* ---------- Layout ---------- */
        #root { height: 100%; }
        .app {
            max-width: 480px; margin: 0 auto;
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
        }
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: calc(12px + env(safe-area-inset-top)) 20px 8px;
        }
        .wordmark { font: 700 18px var(--display); letter-spacing: -0.01em; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; border: 0;
            background: var(--ink); color: var(--chalk);
            font: 700 16px var(--display);
        }
        .screen {
            flex: 1; overflow-y: auto; overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 8px 20px 32px;
        }
        .screen.is-coach { display: flex; flex-direction: column; padding-bottom: 12px; }

        .tabbar {
            display: grid; grid-template-columns: repeat(5, 1fr);
            background: var(--surface); border-top: 1px solid var(--line);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab {
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            min-height: 60px; padding: 6px 0 6px;
            border: 0; background: none; color: var(--ink-2);
            font: 600 12px var(--body);
        }
        .tab .ico { width: 52px; height: 30px; border-radius: 15px; display: grid; place-items: center; transition: background .2s; }
        .tab[aria-current="page"] { color: var(--ink); }
        .tab[aria-current="page"] .ico { background: var(--ink); color: var(--chalk); }

        /* ---------- Type ---------- */
        .h1 { font: 700 28px/1.1 var(--display); letter-spacing: -0.02em; }
        .h2 { font: 700 18px/1.2 var(--display); }
        .sub { color: var(--ink-2); font-size: 14px; margin-top: 4px; }
        .between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        .section { padding: 20px 0; border-top: 1px solid var(--line); }
        .link {
            background: none; border: 0; padding: 0 4px; min-height: 44px;
            font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px;
        }

        /* ---------- Controls ---------- */
        .btn {
            width: 100%; min-height: 48px; padding: 0 20px;
            border: 0; border-radius: 14px;
            background: var(--ink); color: var(--chalk);
            font: 600 16px var(--body);
            transition: transform .1s;
        }
        .btn:active { transform: scale(.98); }
        .btn:disabled { opacity: .5; }
        .btn.secondary { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
        a.link { display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
        .btn.danger { background: var(--over); color: var(--on-over); }
        .steps { margin: 12px 0 16px; padding-left: 20px; }
        .steps li { margin-bottom: 8px; }
        .btn.small { width: auto; min-height: 44px; padding: 0 16px; font-size: 15px; border-radius: 12px; }
        .field { display: block; margin-bottom: 12px; }
        .field > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
        .in {
            width: 100%; min-height: 48px; padding: 0 14px;
            border: 1.5px solid var(--line); border-radius: 12px;
            background: var(--surface); color: var(--ink);
            font-size: 16px; /* 16px stops iOS from zooming on focus */
        }
        .in:focus { border-color: var(--ink); outline: none; }
        .in:focus-visible { outline: 2px solid var(--protein); outline-offset: 2px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .iconbtn {
            width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
            display: grid; place-items: center; color: var(--ink-2); flex-shrink: 0;
        }
        .iconbtn:disabled { opacity: .3; }
        .pill {
            min-height: 36px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 999px;
            background: var(--surface); font-weight: 600; font-size: 13px;
        }
        .msg { padding: 12px 14px; border-radius: 12px; font-size: 14px; margin-top: 16px; }
        .msg.error { background: rgba(210, 73, 47, .14); background: color-mix(in srgb, var(--over) 14%, transparent); color: var(--over); }
        .msg.info { background: rgba(46, 139, 87, .14); background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }

        /* ---------- Macro display ---------- */
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .mc { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); margin-right: 12px; }
        .mc i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .mc b { color: var(--ink); font-weight: 700; }
        .ringwrap { display: grid; place-items: center; padding: 20px 0 24px; }
        .ring { width: min(72vw, 270px); height: auto; }
        .ringcap { margin-top: 6px; color: var(--ink-2); font-size: 14px; }
        .mbar { margin-bottom: 18px; }
        .mhead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-weight: 600; }
        .mhead .num { font-size: 15px; }
        .bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 5px; transition: width .5s ease; }
        .mfoot { margin-top: 6px; font-size: 13px; color: var(--ink-2); }

        .weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 14px; }
        .wd { font-size: 12px; color: var(--ink-2); font-weight: 600; }
        .wc {
            width: 36px; height: 36px; border-radius: 50%; margin: 4px auto 0;
            display: grid; place-items: center;
            font: 700 14px var(--display); border: 1.5px solid var(--line); color: var(--ink-2);
        }
        .wc.logged { background: var(--ink); color: var(--chalk); border-color: var(--ink); }
        .wc.today { outline: 2px solid var(--ink); outline-offset: 2px; }
        .wc.future { opacity: .45; }
        .streak {
            display: inline-flex; align-items: center; padding: 6px 14px;
            border: 1.5px solid var(--line); border-radius: 999px;
            font-weight: 600; font-size: 14px;
        }

        .note { border-left: 3px solid var(--ink); padding: 2px 0 2px 14px; }
        .note .who { font: 700 14px var(--display); margin-bottom: 4px; }
        .note p { font-size: 15px; }

        .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
        .row:first-of-type { border-top: 0; }
        .rname { font-weight: 600; word-break: break-word; }
        .rmeta { margin-top: 2px; }
        .rcal { font-size: 18px; font-weight: 700; white-space: nowrap; }
        .rcal small { font: 500 13px var(--body); color: var(--ink-2); }
        .empty { padding: 8px 0 4px; }
        .empty p { color: var(--ink-2); margin-bottom: 14px; }

        .gh { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 0 6px; font: 700 16px var(--display); }
        .gh small { font: 500 13px var(--body); color: var(--ink-2); }

        .score { font: 700 64px/1 var(--display); letter-spacing: -0.03em; }
        .weeknav { display: flex; align-items: center; justify-content: space-between; }
        .weeknav .label { text-align: center; }

        /* ---------- Log tab ---------- */
        .searchrow { display: flex; gap: 8px; }
        .result {
            display: block; width: 100%; text-align: left; background: none; border: 0;
            border-top: 1px solid var(--line); padding: 12px 0; min-height: 56px;
        }
        .result .rname { font-size: 15px; }
        .picked { border-left: 3px solid var(--ink); padding: 4px 0 4px 14px; }
        .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .tile {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            min-height: 96px; padding: 12px 8px; text-align: center;
            border: 1.5px dashed var(--line); border-radius: 14px;
            font-weight: 600; font-size: 14px; cursor: pointer;
        }

        /* ---------- Coach ---------- */
        .msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 8px 0; min-height: 0; }
        .bubble { max-width: 86%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
        .bubble.user { align-self: flex-end; background: var(--ink); color: var(--chalk); border-bottom-right-radius: 6px; }
        .bubble.coach { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
        .bubble.wait { color: var(--ink-2); }
        .chat-empty { margin: auto 0; padding: 12px 0; }
        .qchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .qchip {
            min-height: 44px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: 999px;
            background: var(--surface); font-weight: 600; font-size: 14px;
        }
        .composer { display: flex; gap: 8px; padding-top: 8px; }
        .send { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--ink); color: var(--chalk); display: grid; place-items: center; flex-shrink: 0; }

        /* ---------- Sheet, toast, busy ---------- */
        .sheet { position: fixed; inset: 0; z-index: 50; display: none; }
        .sheet.open { display: block; }
        .scrim { position: absolute; inset: 0; background: rgba(8, 18, 13, .5); }
        .panel {
            position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
            width: min(100%, 480px); max-height: 88vh; max-height: 88dvh; overflow-y: auto;
            background: var(--surface); border-radius: 20px 20px 0 0;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
            animation: rise .22s ease-out;
        }
        .panel:focus { outline: none; }
        @keyframes rise { from { transform: translate(-50%, 24px); opacity: .6; } to { transform: translate(-50%, 0); opacity: 1; } }
        .toast {
            position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
            bottom: calc(80px + env(safe-area-inset-bottom));
            max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px;
            background: var(--ink); color: var(--chalk); font-weight: 600; font-size: 14px; text-align: center;
        }
        .toast.error { background: var(--over); color: var(--on-over); }
        .busy {
            position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
            top: calc(64px + env(safe-area-inset-top));
            display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px;
            background: var(--ink); color: var(--chalk); font-weight: 600; font-size: 14px;
        }
        .spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Login ---------- */
        .auth-wrap { height: 100vh; height: 100dvh; overflow-y: auto; position: relative; }
        .auth { max-width: 420px; margin: 0 auto; padding: calc(48px + env(safe-area-inset-top)) 24px 32px; }
        .brand { font: 700 40px/1.05 var(--display); letter-spacing: -0.03em; }
        .tag { color: var(--ink-2); margin-top: 10px; max-width: 30ch; }
        .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--line); border-radius: 12px; padding: 4px; margin: 28px 0 20px; }
        .seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 15px; }
        .seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
        .seg.three { grid-template-columns: repeat(3, 1fr); }
        .topright { display: flex; align-items: center; gap: 6px; }
        .theme-fab { position: absolute; top: calc(12px + env(safe-area-inset-top)); right: 12px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="busy" class="busy hidden" role="status" aria-live="polite"><span class="spin"></span><span id="busyText"></span></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
    <div id="sheet" class="sheet" aria-hidden="true"></div>

    <script>
        // =====================================================================
        // CONFIG  --  from Supabase > Project Settings > API
        // (the anon / publishable key is safe in the browser because RLS
        //  protects the data; NEVER put the service_role key here)
        // =====================================================================
        const SUPABASE_URL = 'https://dnxovaywkdvpfdtlqgvy.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRueG92YXl3a2R2cGZkdGxxZ3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzY5ODksImV4cCI6MjEwNTQxMjk4OX0.cQE2zfdtkMPiyYc4zyf1OLttjyEPpF_oocp4Fni74iw';

        // n8n is still used for AI features (photo analysis, barcode, AI coach)
        const N8N_BASE = 'https://billbotprocessing.app.n8n.cloud/webhook';
        // Named in the AI permission screen (Apple requires naming it). Replace with the provider your n8n coach uses.
        const AI_PROVIDER_NAME = 'OpenAI';

        const isConfigured = !SUPABASE_URL.includes('YOUR_PROJECT_REF') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
        // Keep only https://<ref>.supabase.co (drops any accidental /rest/v1/ or trailing slash)
        const SUPABASE_BASE = isConfigured ? new URL(SUPABASE_URL.trim()).origin : '';
        const sb = isConfigured ? window.supabase.createClient(SUPABASE_BASE, SUPABASE_ANON_KEY.trim()) : null;

        // State management
        let state = {
            activeTab: 'dashboard',
            goals: { protein: 150, carbs: 200, fats: 65, calories: 2000 },
            foodEntries: [],
            chatMessages: [],
            selectedWeek: 0,
            user: null,
            isAuthenticated: false,
            foodSearch: newFoodSearch()
        };
        let chatBusy = false;

        function newFoodSearch() {
            return { query: '', loading: false, results: null, error: null, selected: null, grams: 100 };
        }

        // ---------- Helpers ----------
        const pad = n => String(n).padStart(2, '0');
        // Local calendar day as YYYY-MM-DD (avoids timezone shifts from toISOString)
        function toISO(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
        // Parse YYYY-MM-DD as a LOCAL date (new Date('2026-09-19') would be UTC and can show the previous day)
        function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); }
        function fmtShort(s) { return parseISO(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
        function fmtLong(s) { return parseISO(s).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }
        function num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; }
        function round1(n) { return Math.round(n * 10) / 10; }
        // Serving sizes from USDA can arrive as long floats (28.399999618530273) or
        // shouty unit codes (ONZ, GRM) - clean both up for display.
        function fmtGrams(g) { return round1(num(g)); }
        const SERVING_UNIT_LABELS = { ONZ: 'oz', OZ: 'oz', GRM: 'g', GM: 'g', ML: 'mL', MLT: 'mL', LT: 'L', CUP: 'cup', TBSP: 'tbsp', TSP: 'tsp', PKG: 'package', SERVING: 'serving', SLICE: 'slice', PIECE: 'piece', CT: 'count', BAR: 'bar', CAN: 'can', BTL: 'bottle' };
        function fmtServingText(t) {
            if (!t) return '';
            return String(t).trim().split(/\s+/).map(word => {
                const clean = word.replace(/[(),]/g, '');
                const label = SERVING_UNIT_LABELS[clean.toUpperCase()];
                return label ? word.replace(clean, label) : word;
            }).join(' ');
        }
        function gramsToOz(g) { return round1(num(g) / 28.3495); }
        function pct(value, goal) { return goal > 0 ? Math.min((value / goal) * 100, 100) : 0; }
        function fmt(n) { return Number(n).toLocaleString('en-US'); }
        function truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1).trimEnd() + '...' : s; }
        // Escape anything user- or AI-supplied before it goes into innerHTML
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function nowTime() { return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
        function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
        function firstName() { return String((state.user && state.user.name) || '').trim().split(' ')[0] || 'there'; }
        function fromRow(r) {
            return {
                id: r.id, name: r.name,
                protein: num(r.protein), carbs: num(r.carbs), fats: num(r.fats), calories: num(r.calories),
                date: r.entry_date, time: r.entry_time || ''
            };
        }
        function toRow(e) {
            return {
                name: e.name, protein: e.protein, carbs: e.carbs, fats: e.fats, calories: e.calories,
                entry_date: e.date, entry_time: e.time
            };
        }

        // ---------- Icons (one consistent set) ----------
        const ICONS = {
            today: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',
            week: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
            plus: '<path d="M12 5v14M5 12h14"/>',
            history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
            coach: '<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
            camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>',
            barcode: '<path d="M4 6v12M7 6v12M10 6v12M14 6v12M17 6v12M20 6v12"/>',
            trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
            left: '<path d="M15 5l-7 7 7 7"/>',
            right: '<path d="M9 5l7 7-7 7"/>',
            send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
            close: '<path d="M6 6l12 12M18 6L6 18"/>',

        // ---------- Theme (light / dark / system) ----------
        function getThemePref() {
            try { const t = localStorage.getItem('theme'); return t === 'light' || t === 'dark' ? t : 'system'; }
            catch (e) { return 'system'; }
        }
        function systemPrefersDark() {
            return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        }
        function resolvedTheme() {
            const p = getThemePref();
            return p === 'system' ? (systemPrefersDark() ? 'dark' : 'light') : p;
        }
        function applyTheme() {
            const pref = getThemePref(), root = document.documentElement;
            if (pref === 'system') { root.removeAttribute('data-theme'); root.style.colorScheme = 'light dark'; }
            else { root.setAttribute('data-theme', pref); root.style.colorScheme = pref; }
            const meta = document.getElementById('themeColor');
            if (meta) meta.setAttribute('content', resolvedTheme() === 'dark' ? '#0F1713' : '#F2F4F1');
        }
        function themeButtonHTML(cls) {
            const dark = resolvedTheme() === 'dark';
            return `<button class="iconbtn theme-btn ${cls || ''}" onclick="toggleTheme()" aria-label="${dark ? 'Switch to light mode' : 'Switch to dark mode'}">${icon(dark ? 'sun' : 'moon')}</button>`;
        }
        function updateThemeButtons() {
            const dark = resolvedTheme() === 'dark';
            document.querySelectorAll('.theme-btn').forEach(b => {
                b.innerHTML = icon(dark ? 'sun' : 'moon');
                b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
            });
        }
        function setTheme(pref) {
            try { if (pref === 'system') localStorage.removeItem('theme'); else localStorage.setItem('theme', pref); } catch (e) {}
            applyTheme();
            updateThemeButtons();
            if (document.getElementById('themeSeg')) openMenuSheet();   // refresh the selected option
        }
        function toggleTheme() { setTheme(resolvedTheme() === 'dark' ? 'light' : 'dark'); }
        applyTheme();
        // Follow the phone's setting live while the choice is "System"
        if (window.matchMedia) {
            const mq = window.matchMedia('(prefers-color-scheme: dark)');
            const onChange = () => { if (getThemePref() === 'system') { applyTheme(); updateThemeButtons(); } };
            if (mq.addEventListener) mq.addEventListener('change', onChange);
        }

        // ---------- Data persistence (Supabase Postgres, protected by RLS) ----------
        async function loadData() {
            if (!state.user) return;
            const uid = state.user.userId;

            try {
                const [goalsRes, entriesRes, chatRes] = await Promise.all([
                    sb.from('user_goals').select('protein,carbs,fats,calories').eq('user_id', uid).maybeSingle(),
                    sb.from('food_entries').select('*')
                        .order('entry_date', { ascending: false })
                        .order('id', { ascending: false })
                        .limit(1000),
                    sb.from('chat_messages').select('role,content')
                        .order('id', { ascending: false })
                        .limit(50)
                ]);

                if (goalsRes.error) throw goalsRes.error;
                if (entriesRes.error) throw entriesRes.error;
                if (chatRes.error) throw chatRes.error;

                if (goalsRes.data) {
                    state.goals = {
                        protein: num(goalsRes.data.protein), carbs: num(goalsRes.data.carbs),
                        fats: num(goalsRes.data.fats), calories: num(goalsRes.data.calories)
                    };
                }
                state.foodEntries = (entriesRes.data || []).map(fromRow);
                state.chatMessages = (chatRes.data || []).reverse();
            } catch (error) {
                console.error('Failed to load data from Supabase:', error);
                toast('Could not load your data: ' + (error.message || 'check your connection.'), 'error');
            }
        }

        // ---------- Calculations ----------
        function getTodayEntries() {
            const today = toISO(new Date());
            return state.foodEntries.filter(e => e.date === today);
        }

        function sumEntries(entries) {
            return entries.reduce((acc, e) => ({
                protein: acc.protein + num(e.protein),
                carbs: acc.carbs + num(e.carbs),
                fats: acc.fats + num(e.fats),
                calories: acc.calories + num(e.calories)
            }), { protein: 0, carbs: 0, fats: 0, calories: 0 });
        }

        function roundTotals(t) {
            return { protein: round1(t.protein), carbs: round1(t.carbs), fats: round1(t.fats), calories: Math.round(t.calories) };
        }

        function calculateTotals() { return roundTotals(sumEntries(getTodayEntries())); }
        function calculateDayTotals(date) { return roundTotals(sumEntries(state.foodEntries.filter(e => e.date === date))); }

        function getWeekDates(weeksAgo = 0) {
            const dates = [];
            const today = new Date();
            const startOfWeek = new Date(today.getFullYear(), today.getMonth(), today.getDate());
            startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay() - (weeksAgo * 7));
            for (let i = 0; i < 7; i++) {
                const date = new Date(startOfWeek);
                date.setDate(startOfWeek.getDate() + i);
                dates.push(toISO(date));
            }
            return dates;
        }

        function calculateWeeklyScore(weeksAgo = 0) {
            const weekDates = getWeekDates(weeksAgo);
            let totalScore = 0, daysTracked = 0;
            weekDates.forEach(date => {
                const totals = calculateDayTotals(date);
                if (totals.calories > 0) {
                    daysTracked++;
                    const pScore = pct(totals.protein, state.goals.protein);
                    const cScore = pct(totals.carbs, state.goals.carbs);
                    const fScore = pct(totals.fats, state.goals.fats);
                    const calScore = Math.abs(totals.calories - state.goals.calories) <= state.goals.calories * 0.1 ? 100 : 70;
                    totalScore += (pScore + cScore + fScore + calScore) / 4;
                }
            });
            return { score: daysTracked > 0 ? Math.round(totalScore / daysTracked) : 0, daysTracked };
        }

        // Consecutive logged days ending today (or yesterday, if today is not logged yet)
        function calcStreak() {
            const days = new Set(state.foodEntries.map(e => e.date));
            const d = new Date();
            if (!days.has(toISO(d))) d.setDate(d.getDate() - 1);
            let streak = 0;
            while (days.has(toISO(d))) { streak++; d.setDate(d.getDate() - 1); }
            return streak;
        }

        // ---------- Shared bits ----------
        function dots(m) {
            return `<span class="mc"><i style="background:var(--protein)"></i><span class="sr">protein </span>${m.protein}g</span>` +
                   `<span class="mc"><i style="background:var(--carbs)"></i><span class="sr">carbs </span>${m.carbs}g</span>` +
                   `<span class="mc"><i style="background:var(--fats)"></i><span class="sr">fats </span>${m.fats}g</span>`;
        }
        function macroLine(m) {
            return `<span class="mc"><b>${fmt(m.calories)}</b> cal</span>` + dots(m);
        }

        // The calorie ring: arcs are split by where the calories came from (protein, carbs, fats)
        function renderRing(t) {
            const goal = num(state.goals.calories), cal = t.calories;
            const R = 92, C = 2 * Math.PI * R, sw = 20;
            const filled = goal > 0 ? Math.min(cal / goal, 1) : 0;
            const parts = [[t.protein * 4, 'var(--protein)'], [t.carbs * 4, 'var(--carbs)'], [t.fats * 9, 'var(--fats)']].filter(p => p[0] > 0);
            const sum = parts.reduce((a, p) => a + p[0], 0);
            let off = 0, arcs = '';
            parts.forEach(([v, color]) => {
                const len = (v / sum) * filled * C;
                const gap = parts.length > 1 ? 3 : 0;
                arcs += `<circle cx="120" cy="120" r="${R}" fill="none" style="stroke:${color}" stroke-width="${sw}"
                    stroke-dasharray="${Math.max(len - gap, 0.01)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 120 120)"/>`;
                off += len;
            });
            const rem = goal - cal, over = rem < 0;
            return `
                <svg class="ring" viewBox="0 0 240 240" role="img" aria-label="${fmt(cal)} of ${fmt(goal)} calories logged, ${fmt(Math.abs(rem))} ${over ? 'over' : 'left'}">
                    <circle cx="120" cy="120" r="${R}" fill="none" style="stroke:var(--line)" stroke-width="${sw}"/>
                    ${arcs}
                    <text x="120" y="122" text-anchor="middle" style="font:700 46px var(--display);fill:${over ? 'var(--over)' : 'var(--ink)'}">${fmt(Math.abs(rem))}</text>
                    <text x="120" y="148" text-anchor="middle" style="font:500 14px var(--body);fill:var(--ink-2)">${over ? 'calories over' : 'calories left'}</text>
                </svg>
                <p class="ringcap">${fmt(cal)} of ${fmt(goal)} calories</p>`;
        }

        function renderMacroBar(label, current, goal, colorVar) {
            const remaining = round1(goal - current);
            return `

                    <div class="mhead">
                        <span><span class="dot" style="background:var(${colorVar})"></span>${label}</span>
                        <span class="num">${current} / ${goal} g</span>

                    <div class="bar"><i style="width:${pct(current, goal)}%;background:var(${colorVar})"></i></div>
                    <div class="mfoot">${remaining > 0 ? `${remaining} g to go` : 'Goal reached'}</div>
                </div>`;
        }

        async function saveGoals() {

                fats: parseInt(document.getElementById('goalFats').value) || 0,

            const { error } = await sb.from('user_goals').upsert({
                user_id: state.user.userId,
                ...goals,
                updated_at: new Date().toISOString()
            }, { onConflict: 'user_id' });

            if (error) {
                console.error('Failed to save goals:', error);

            closeSheet();
            renderActiveTab();
            toast('Goals saved');

            const { data, error } = await sb.from('food_entries')
                .insert({ user_id: state.user.userId, ...toRow(entry) })
                .select()
                .single();
            if (error) throw error;
            const saved = fromRow(data);
            state.foodEntries.unshift(saved);
            return saved;
        }

            const entry = readEntryFields('food');

                console.error('Failed to save entry:', error);

                console.error('Failed to delete entry:', error);

        // ---------- Food search (Supabase Edge Function -> USDA FoodData Central) ----------
        const FOOD_SEARCH_ERRORS = {
            short: 'Type at least 2 characters to search.',
            rate_limited: 'Food search is busy right now. Please try again in a minute.',
            bad_key: 'Food search is not set up correctly yet. Check the USDA API key secret in Supabase.',
            network: "Couldn't reach the food database. Please try again.",
            upstream: "Couldn't reach the food database. Please try again."
        };

        function portionMacros(food, grams) {
            const f = num(grams) / 100;
            return {
                calories: Math.round(food.per100g.calories * f),
                protein: round1(food.per100g.protein * f),
                carbs: round1(food.per100g.carbs * f),
                fats: round1(food.per100g.fats * f)
            };
        }

        function getRecentFoods() {
            const seen = new Set(), out = [];
            for (const e of state.foodEntries) {
                const key = String(e.name).toLowerCase();
                if (seen.has(key)) continue;
                seen.add(key);
                out.push(e);
                if (out.length >= 8) break;
            }
            return out;
        }

        function renderFoodSearchResults() {
            const fs = state.foodSearch;

            if (fs.loading) {
                return '<p class="sub">Searching...</p>';
            }

            if (fs.selected) {
                const f = fs.selected;
                const m = portionMacros(f, fs.grams);
                return `
                    <div class="picked">
                        <div class="rname">${esc(f.name)}</div>
                        ${f.brand ? `<div class="sub" style="margin-top:0">${esc(f.brand)}</div>` : ''}
                        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px">
                            <label for="foodGrams" style="font-weight:600;font-size:14px">Amount (g)</label>
                            <input type="number" inputmode="decimal" id="foodGrams" min="1" step="1" value="${fmtGrams(fs.grams)}"
                                oninput="updateFoodPortion()" class="in" style="width:96px">
                            <span class="sub" id="foodGramsOz" style="margin:0">&asymp; ${gramsToOz(fs.grams)} oz</span>
                        </div>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
                            <button class="pill" onclick="setFoodGrams(100)">100 g</button>
                            ${f.servingGrams ? `<button class="pill" onclick="setFoodGrams(${fmtGrams(f.servingGrams)})">1 serving${f.servingText ? ' (' + esc(fmtServingText(f.servingText)) + ')' : ''}, ${fmtGrams(f.servingGrams)} g</button>` : ''}
                        </div>
                        <div id="foodPortionMacros" style="margin-top:12px">${macroLine(m)}</div>
                        <div class="grid2" style="margin-top:14px">
                            <button class="btn" onclick="applySelectedFood()">Use this food</button>
                            <button class="btn secondary" onclick="clearSelectedFood()">Back to results</button>
                        </div>
                    </div>`;
            }

            if (fs.error) {
                return `<div class="msg error" style="margin-top:0"><p>${esc(FOOD_SEARCH_ERRORS[fs.error] || FOOD_SEARCH_ERRORS.network)}</p></div>`;
            }

            if (fs.results !== null) {
                if (fs.results.length === 0) {
                    return `<p class="sub">No matches. Try a simpler term, like "chicken" instead of "grilled chicken sandwich".</p>
                            <button class="link" style="padding-left:0" onclick="clearFoodSearch()">Clear search</button>`;
                }
                return `
                    <div class="between">
                        <span class="sub" style="margin:0">${fs.results.length} results, values per 100 g</span>
                        <button class="link" onclick="clearFoodSearch()">Clear</button>
                    </div>
                    <div style="max-height:360px;overflow-y:auto">
                        ${fs.results.map((f, i) => `
                            <button class="result" onclick="selectFood(${i})">
                                <div class="rname">${esc(f.name)}</div>
                                ${f.brand ? `<div class="sub" style="margin:0">${esc(f.brand)}</div>` : ''}
                                <div class="rmeta">${macroLine(f.per100g)}</div>
                            </button>`).join('')}
                    </div>
                    <p class="sub">Food data: USDA FoodData Central</p>`;
            }

            // No search yet: offer recently logged foods for one-tap re-logging
            const recent = getRecentFoods();
            if (recent.length === 0) return '';
            return `
                <div class="sub" style="margin:0 0 8px">Recent foods</div>
                <div class="qchips" style="margin-top:0">
                    ${recent.map((e, i) => `<button class="qchip" onclick="useRecentFood(${i})">${esc(e.name)}</button>`).join('')}
                </div>`;
        }

        function updateFoodSearchUI() {
            const el = document.getElementById('foodSearchResults');
            if (el) el.innerHTML = renderFoodSearchResults();
        }

        async function searchFoods() {
            const fs = state.foodSearch;
            if (fs.loading) return;

            const input = document.getElementById('foodSearchInput');
            const query = (input ? input.value : fs.query).trim();
            fs.query = query;

            if (query.length < 2) {
                fs.error = 'short';
                fs.selected = null;
                updateFoodSearchUI();
                return;
            }

            fs.loading = true;
            fs.error = null;
            fs.selected = null;
            updateFoodSearchUI();

            try {
                const { data, error } = await sb.functions.invoke('food-search', { body: { query } });
                if (error) throw error;
                if (data && data.error) {
                    fs.results = [];
                    fs.error = data.error;
                } else {
                    fs.results = (data && data.results) || [];
                }
            } catch (err) {
                console.error('Food search failed:', err);
                fs.results = [];
                fs.error = 'network';
            }

            fs.loading = false;
            updateFoodSearchUI();
        }

        function selectFood(i) {
            const fs = state.foodSearch;
            const f = fs.results && fs.results[i];
            if (!f) return;
            fs.selected = f;
            fs.grams = fmtGrams(f.servingGrams) || 100;
            updateFoodSearchUI();
        }

        function clearSelectedFood() {
            state.foodSearch.selected = null;
            updateFoodSearchUI();
        }

        function clearFoodSearch() {
            state.foodSearch = newFoodSearch();
            const input = document.getElementById('foodSearchInput');
            if (input) input.value = '';
            updateFoodSearchUI();
        }

        function setFoodGrams(g) {
            state.foodSearch.grams = g;
            const input = document.getElementById('foodGrams');
            if (input) input.value = g;
            updateFoodPortion();
        }

        function updateFoodPortion() {
            const fs = state.foodSearch;
            const input = document.getElementById('foodGrams');
            if (input) fs.grams = num(input.value);
            const oz = document.getElementById('foodGramsOz');
            if (oz) oz.textContent = `≈ ${gramsToOz(fs.grams)} oz`;
            const el = document.getElementById('foodPortionMacros');
            if (el && fs.selected) el.innerHTML = macroLine(portionMacros(fs.selected, fs.grams));
        }

        function fillFoodForm(name, m) {
            document.getElementById('foodName').value = name;
            document.getElementById('foodProtein').value = m.protein;
            document.getElementById('foodCarbs').value = m.carbs;
            document.getElementById('foodFats').value = m.fats;
            document.getElementById('foodCalories').value = m.calories;
            document.getElementById('foodName').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function applySelectedFood() {
            const fs = state.foodSearch;
            const f = fs.selected;
            const grams = num(fs.grams);
            if (!f || grams <= 0) return;
            fillFoodForm(`${f.name}${f.brand ? ' (' + f.brand + ')' : ''} - ${grams} g`, portionMacros(f, grams));
            fs.selected = null;
            updateFoodSearchUI();
            toast('Filled in. Check the details, then log it.');
        }

        function useRecentFood(i) {
            const e = getRecentFoods()[i];
            if (!e) return;
            fillFoodForm(e.name, { protein: e.protein, carbs: e.carbs, fats: e.fats, calories: e.calories });
        }

        // ---------- AI features (still served by n8n) ----------
        // Phone photos are large; shrink them before upload so scans are faster and cheaper.
        function resizeImage(file, maxDim = 1600) {
            return new Promise((resolve) => {
                const readRaw = () => {
                    const r = new FileReader();
                    r.onload = () => resolve({ base64: String(r.result).split(',')[1], mime: file.type });
                    r.onerror = () => resolve(null);
                    r.readAsDataURL(file);
                };
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    try {
                        const s = Math.min(1, maxDim / Math.max(img.width, img.height));
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * s);
                        c.height = Math.round(img.height * s);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        resolve({ base64: c.toDataURL('image/jpeg', 0.85).split(',')[1], mime: 'image/jpeg' });
                    } catch { readRaw(); }
                };
                img.onerror = () => { URL.revokeObjectURL(url); readRaw(); };
                img.src = url;
            });
        }

        async function analyzeImage(event, endpoint, busyText, failText) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            if (!(await requireAIConsent())) { toast('Photo scanning needs your permission to use AI.', 'error'); return; }

            showBusy(busyText);
            try {
                const img = await resizeImage(file);
                if (!img) throw new Error('read failed');

                const response = await fetch(N8N_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: img.base64, mimeType: img.mime })
                });
                const data = await response.json();
                console.log('Scan response from', endpoint, response.status, data);
                if (!response.ok) throw new Error('Scan failed with status ' + response.status);

                // n8n can answer with something like {"message":"Workflow was started"}; that is not a result
                const found = data && typeof data === 'object' &&
                    (data.name || data.calories !== undefined || data.protein !== undefined || data.carbs !== undefined || data.fats !== undefined);
                if (!found) {
                    toast('Nothing was recognized in that image. Try a clearer photo, or enter it manually.', 'error');
                    return;
                }

                if (data.name) document.getElementById('foodName').value = data.name;
                if (data.protein !== undefined) document.getElementById('foodProtein').value = data.protein;
                if (data.carbs !== undefined) document.getElementById('foodCarbs').value = data.carbs;
                if (data.fats !== undefined) document.getElementById('foodFats').value = data.fats;
                if (data.calories !== undefined) document.getElementById('foodCalories').value = data.calories;

                document.getElementById('foodName').scrollIntoView({ behavior: 'smooth', block: 'center' });
                toast('Filled in. Check the details, then log it.');
            } catch (error) {
                console.error(failText, error);
                toast(failText, 'error');
            } finally {
                hideBusy();
            }
        }

        function handleBarcodeUpload(event) {
            return analyzeImage(event, '/scan', 'Scanning barcode...', 'Could not read that barcode. Try again or enter it manually.');
        }

        function handleImageUpload(event) {
            return analyzeImage(event, '/photo', 'Analyzing photo...', 'Could not analyze that photo. Try again or enter it manually.');
        }

        async function sendChat(preset) {
            const input = document.getElementById('chatInput');
            const message = (typeof preset === 'string' ? preset : (input ? input.value : '')).trim();
            if (!message || chatBusy) return;
            if (!(await requireAIConsent())) { toast('Abbs needs your permission to reply.', 'error'); return; }
            if (chatBusy) return;
            chatBusy = true;
            if (input) input.value = '';

            state.chatMessages.push({ role: 'user', content: message });
            state.chatMessages.push({ role: 'assistant', content: 'Thinking...' });
            updateChatUI();

            let replyText = null;
            try {
                const totals = calculateTotals();
                const context = `Current daily progress: ${totals.protein}g/${state.goals.protein}g protein, ${totals.carbs}g/${state.goals.carbs}g carbs, ${totals.fats}g/${state.goals.fats}g fats, ${totals.calories}/${state.goals.calories} calories.`;

                // Extra context so the coach can act as an accountability partner
                const week = calculateWeeklyScore(0);
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                const response = await fetch(N8N_BASE + '/ai-coach', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: state.user.userId,
                        message: message,
                        context: context,
                        goals: state.goals,
                        currentProgress: totals,
                        name: firstName(),
                        localTime: new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
                        meals: getTodayEntries().map(e => ({ name: e.name, protein: e.protein, carbs: e.carbs, fats: e.fats, calories: e.calories, time: e.time })),
                        week: { daysLogged: week.daysTracked, daysSoFar: new Date().getDay() + 1, score: week.score, streak: calcStreak() },
                        yesterday: calculateDayTotals(toISO(yesterday)),
                        conversationHistory: state.chatMessages.slice(0, -2).filter(m => m.content !== 'Thinking...').slice(-10)
                    })
                });

                const data = await response.json();
                replyText = data.response || data.message || null;

                state.chatMessages.pop();
                state.chatMessages.push({
                    role: 'assistant',
                    content: replyText || 'I apologize, I encountered an error. Please try again.'
                });

            } catch (error) {
                console.error('Chat error:', error);
                state.chatMessages.pop();
                state.chatMessages.push({
                    role: 'assistant',
                    content: 'Sorry, I encountered an error connecting to the AI coach. Please try again.'
                });
            }

            // Only persist the exchange if the coach actually answered
            if (replyText) {
                const { error } = await sb.from('chat_messages').insert([
                    { user_id: state.user.userId, role: 'user', content: message },
                    { user_id: state.user.userId, role: 'assistant', content: String(replyText) }
                ]);
                if (error) console.error('Failed to save chat:', error);
            }

            chatBusy = false;
            updateChatUI();
        }

        // ---------- Installable app + offline awareness ----------
        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
            });
        }
        window.addEventListener('offline', () => toast("You're offline. Changes can't be saved until you reconnect.", 'error'));
        window.addEventListener('online', () => toast('Back online'));
    </script>
</body>
